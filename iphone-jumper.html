<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Прыгай через коробки!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #24345c 0%, #7a5a72 45%, #d98f5e 70%, #6BBF6B 70%, #4f9750 100%);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: manipulation;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: transparent;
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
  #hud {
    position: absolute; top: 16px; left: 0; right: 0;
    text-align: center;
    color: #2b2b2b;
    font-weight: 800;
    font-size: 22px;
    text-shadow: 0 2px 4px rgba(255,255,255,0.6);
    pointer-events: none;
  }
  #level {
    font-size: 14px;
    font-weight: 700;
    opacity: 0.85;
    margin-top: 2px;
  }
  #best {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.75;
    margin-top: 2px;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,14,26,0.28);
    color: white; text-align: center;
    padding: 24px;
  }
  #overlay h1 { font-size: 26px; margin-bottom: 8px; }
  #overlay p { font-size: 15px; opacity: 0.9; margin-bottom: 18px; max-width: 280px; }
  #overlay button {
    background: #ffcc00;
    color: #1a1a1a;
    border: none;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: 800;
    box-shadow: 0 4px 0 #cc9f00;
    cursor: pointer;
  }
  #overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #cc9f00; }
  .hidden { display: none !important; }

  #nameInput {
    width: 220px;
    padding: 10px 14px;
    border-radius: 20px;
    border: none;
    font-size: 15px;
    text-align: center;
    margin-bottom: 12px;
    outline: none;
  }
  #secondaryBtn {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1.5px solid rgba(255,255,255,0.6);
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 700;
    margin-top: 12px;
    cursor: pointer;
  }
  #secondaryBtn:active { background: rgba(255,255,255,0.3); }

  #levelToast {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    color: #fff;
    font-weight: 900;
    font-size: 30px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 5;
  }
  #levelToast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #leaderboardOverlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,14,26,0.75);
    color: white; text-align: center;
    padding: 24px;
  }
  #leaderboardOverlay h1 { font-size: 22px; margin-bottom: 14px; }
  #leaderboardList {
    width: 100%;
    max-width: 320px;
    max-height: 340px;
    overflow-y: auto;
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 2px;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { opacity: 0.7; width: 26px; text-align: left; }
  .lb-name { flex: 1; text-align: left; padding-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-weight: 800; }
  .lb-empty { opacity: 0.7; font-size: 14px; padding: 20px 0; }
  #leaderboardOverlay button {
    background: #ffcc00; color: #1a1a1a; border: none;
    padding: 12px 28px; border-radius: 24px; font-size: 15px; font-weight: 800;
    box-shadow: 0 4px 0 #cc9f00; cursor: pointer;
  }
  #leaderboardOverlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #cc9f00; }
</style>
</head>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const secondaryBtn = document.getElementById('secondaryBtn');
const nameInput = document.getElementById('nameInput');
const levelToast = document.getElementById('levelToast');
const leaderboardOverlay = document.getElementById('leaderboardOverlay');
const leaderboardList = document.getElementById('leaderboardList');
const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');

// адрес бота на Render — там же крутится маленькое API таблицы лидеров
const API_URL = 'https://my-tg-bot-v6v3.onrender.com';

const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 90;

// ---- Имя игрока: берём из Telegram, иначе даём ввести вручную ----
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const savedName = localStorage.getItem('jumperName') || '';
nameInput.value = savedName || (tgUser && tgUser.first_name) || '';
nameInput.addEventListener('change', () => {
  localStorage.setItem('jumperName', nameInput.value.trim());
});

function getPlayerName() {
  const val = nameInput.value.trim();
  return val ? val.slice(0, 20) : 'Игрок';
}

// ---- Player: big head guy ----
const player = {
  x: 70,
  y: GROUND_Y,
  vy: 0,
  headR: 40,
  bodyH: 46,
  bodyW: 20,
  onGround: true,
  jumpsUsed: 0,
  maxJumps: 2,
};

const GRAVITY = 0.85;
const JUMP_V = -15;

let obstacles = [];
let speed = 6;
let baseSpeed = 6;
let frame = 0;
let score = 0;
let level = 1;
let levelToastTimer = 0;
const POINTS_PER_LEVEL = 8;   // столько очков нужно для перехода на следующий уровень
const MAX_LEVEL_FOR_SPEED = 12; // после этого уровня скорость перестаёт расти дальше
let running = false;
let gameOver = false;
let spawnTimer = 0;
let nextSpawnIn = 70;

function resetGame() {
  obstacles = [];
  speed = baseSpeed;
  frame = 0;
  score = 0;
  level = 1;
  levelToastTimer = 0;
  levelEl.textContent = 'Уровень 1';
  levelToast.classList.remove('show');
  player.y = GROUND_Y;
  player.vy = 0;
  player.onGround = true;
  player.jumpsUsed = 0;
  gameOver = false;
  spawnTimer = 0;
  nextSpawnIn = 70;
}

function jump() {
  if (!running) return;
  if (player.jumpsUsed < player.maxJumps) {
    player.vy = JUMP_V;
    player.onGround = false;
    player.jumpsUsed++;
  }
}

function spawnObstacle(forceSingle) {
  const h = 34 + Math.random() * 26 + Math.min(level, 6) * 1.5; // на высоких уровнях коробки крупнее
  const w = 34 + Math.random() * 18;
  obstacles.push({ x: W + 20, y: GROUND_Y - h + 40, w, h, passed: false });

  // начиная с 3 уровня иногда добавляем вторую коробку почти сразу следом —
  // требует чёткого двойного прыжка, а не просто одного затяжного
  if (!forceSingle && level >= 3 && Math.random() < Math.min(0.12 + level * 0.03, 0.4)) {
    const h2 = 30 + Math.random() * 22;
    const w2 = 30 + Math.random() * 16;
    const gap = 46 - Math.min(level, 8) * 1.5; // на больших уровнях коробки ближе друг к другу
    obstacles.push({ x: W + 20 + w + Math.max(gap, 22), y: GROUND_Y - h2 + 40, w: w2, h: h2, passed: false });
  }
}

function triggerLevelUp() {
  levelEl.textContent = 'Уровень ' + level;
  levelToast.textContent = 'Уровень ' + level + '!';
  levelToast.classList.add('show');
  levelToastTimer = 70;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function drawBackgroundDetails() {
  // sun glow low on the horizon (Orenburg dusk)
  ctx.save();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = '#ffe3b0';
  ctx.beginPath();
  ctx.arc(W * 0.74, H * 0.20, 34, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 3; i++) {
    const cx = ((i * 180 + 60) - (frame * 0.6) % (W + 200));
    const cy = 55 + i * 32;
    drawCloud(cx, cy);
  }

  // distant Orenburg skyline silhouette — solid, high-contrast
  const skylineY = H * 0.58;
  const SIL = '#1c2036';
  ctx.fillStyle = SIL;
  let sx = -((frame * speed * 0.12) % 90);
  while (sx < W) {
    const bw = 34 + ((sx * 37) % 40);
    const bh = 40 + ((sx * 53) % 70);
    ctx.fillRect(sx, skylineY - bh, bw, bh + 8);
    sx += bw + 12;
  }
  // domed building landmark
  const domeX = W * 0.22 - ((frame * speed * 0.12) % 90);
  ctx.fillStyle = SIL;
  ctx.fillRect(domeX - 18, skylineY - 84, 36, 84);
  ctx.beginPath();
  ctx.arc(domeX, skylineY - 84, 20, Math.PI, 0);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(domeX, skylineY - 122);
  ctx.lineTo(domeX - 3, skylineY - 104);
  ctx.lineTo(domeX + 3, skylineY - 104);
  ctx.closePath();
  ctx.fill();
  // TV tower landmark
  const towerX = W * 0.62 - ((frame * speed * 0.12) % 90) + 90;
  ctx.strokeStyle = SIL;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(towerX - 6, skylineY);
  ctx.lineTo(towerX, skylineY - 118);
  ctx.moveTo(towerX + 6, skylineY);
  ctx.lineTo(towerX, skylineY - 118);
  ctx.moveTo(towerX - 4, skylineY - 40);
  ctx.lineTo(towerX + 4, skylineY - 40);
  ctx.stroke();

  // label so the city reads clearly at a glance
  ctx.save();
  ctx.font = 'bold 13px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.textAlign = 'center';
  ctx.fillText('ОРЕНБУРГ', W / 2, skylineY - 6);
  ctx.restore();

  // Ural river band
  const riverY = skylineY + 8;
  const riverH = 42;
  ctx.fillStyle = '#3f6a8c';
  ctx.fillRect(0, riverY, W, riverH);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) {
    const wy = riverY + 6 + i * 6;
    const wx = -((frame * 1.4 + i * 40) % (W + 60));
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.lineTo(wx + 30, wy);
    ctx.stroke();
  }

  // cable-stayed pedestrian bridge ("Europe-Asia") crossing the river
  const bridgeY = riverY + 6;
  ctx.strokeStyle = SIL;
  [W * 0.28, W * 0.74].forEach((px) => {
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(px - 18, bridgeY);
    ctx.lineTo(px, bridgeY - 78);
    ctx.lineTo(px + 18, bridgeY);
    ctx.stroke();
    ctx.lineWidth = 1.5;
    for (let i = 0; i <= 7; i++) {
      const t = i / 7 - 0.5;
      ctx.beginPath();
      ctx.moveTo(px, bridgeY - 70);
      ctx.lineTo(px + t * 90, bridgeY);
      ctx.stroke();
    }
  });
  ctx.fillStyle = SIL;
  ctx.fillRect(0, bridgeY, W, 5);

  // ground
  ctx.fillStyle = '#4f9750';
  ctx.fillRect(0, GROUND_Y + 40, W, H - GROUND_Y - 40);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let i = 0; i < 6; i++) {
    const gx = (i * 90 - (frame * speed * 0.5) % 90);
    ctx.fillRect(gx, GROUND_Y + 44, 40, 6);
  }
}

function drawCloud(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, Math.PI * 2);
  ctx.arc(x + 20, y - 8, 14, 0, Math.PI * 2);
  ctx.arc(x + 38, y, 16, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer() {
  const bodyTopY = player.y - player.bodyH;
  const headCY = bodyTopY - player.headR + 6;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(player.x + player.bodyW / 2, GROUND_Y + 42, 22, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // legs (simple)
  ctx.strokeStyle = '#2b2b2b';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  const legOffset = player.onGround ? Math.sin(frame * 0.5) * 6 : 6;
  ctx.beginPath();
  ctx.moveTo(player.x + 4, player.y);
  ctx.lineTo(player.x + 4 - legOffset, player.y + 18);
  ctx.moveTo(player.x + player.bodyW - 4, player.y);
  ctx.lineTo(player.x + player.bodyW - 4 + legOffset, player.y + 18);
  ctx.stroke();

  // body
  ctx.fillStyle = '#232f4d';
  ctx.beginPath();
  ctx.roundRect(player.x, bodyTopY, player.bodyW, player.bodyH, 8);
  ctx.fill();

  // arms
  ctx.strokeStyle = '#232f4d';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(player.x, bodyTopY + 10);
  ctx.lineTo(player.x - 12, bodyTopY + (player.onGround ? 22 : 0));
  ctx.moveTo(player.x + player.bodyW, bodyTopY + 10);
  ctx.lineTo(player.x + player.bodyW + 12, bodyTopY + (player.onGround ? 22 : 0));
  ctx.stroke();

  // big head — real photo cut to the actual silhouette contour (baked into the PNG alpha), enlarged
  const headCX = player.x + player.bodyW / 2;
  const r = player.headR;
  if (faceImg.complete && faceImg.naturalWidth > 0) {
    const aspect = faceImg.naturalHeight / faceImg.naturalWidth;
    const dw = r * 2.5;
    const dh = dw * aspect;
    ctx.drawImage(
      faceImg,
      headCX - dw / 2, headCY - dh * 0.48,
      dw, dh
    );
  } else {
    ctx.fillStyle = '#ffd6a5';
    ctx.beginPath();
    ctx.arc(headCX, headCY, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawObstacle(o) {
  // box
  ctx.fillStyle = '#a5651b';
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.strokeStyle = '#6e4212';
  ctx.lineWidth = 2;
  ctx.strokeRect(o.x, o.y, o.w, o.h);
  // tape cross
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(o.x + o.w / 2, o.y);
  ctx.lineTo(o.x + o.w / 2, o.y + o.h);
  ctx.moveTo(o.x, o.y + o.h / 2);
  ctx.lineTo(o.x + o.w, o.y + o.h / 2);
  ctx.stroke();
  // iphone label
  ctx.font = Math.floor(o.h * 0.5) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('📱', o.x + o.w / 2, o.y + o.h / 2);
}

function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return (dx * dx + dy * dy) < (r * r);
}

function checkCollision() {
  const headCX = player.x + player.bodyW / 2;
  const headCY = player.y - player.bodyH - player.headR + 6;
  const bodyRect = { x: player.x, y: player.y - player.bodyH, w: player.bodyW, h: player.bodyH };

  for (const o of obstacles) {
    if (circleRectCollide(headCX, headCY, player.headR - 4, o.x, o.y, o.w, o.h)) return true;
    if (bodyRect.x < o.x + o.w && bodyRect.x + bodyRect.w > o.x &&
        bodyRect.y < o.y + o.h && bodyRect.y + bodyRect.h > o.y) return true;
  }
  return false;
}

function endGame() {
  running = false;
  gameOver = true;
  if (score > best) {
    best = score;
    localStorage.setItem('jumperBest', String(best));
  }
  bestEl.textContent = 'Рекорд: ' + best;
  showOverlay('💥 Разбил коробку!', `Очки: ${score} · Уровень ${level}`, 'Ещё раз');
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
  submitScore(getPlayerName(), score);
}

function showOverlay(title, subtitle, btnText) {
  overlay.querySelector('h1').textContent = title;
  overlay.querySelector('p').textContent = subtitle;
  startBtn.textContent = btnText;
  overlay.classList.remove('hidden');
}

// ---- Таблица лидеров: общий сервер, видна всем игрокам ----

async function submitScore(name, points) {
  if (points <= 0) return;
  try {
    await fetch(API_URL + '/leaderboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, score: points }),
    });
  } catch (e) {
    // офлайн или сервер уснул — не мешаем игроку, просто не обновляем рейтинг
  }
}

async function openLeaderboard() {
  leaderboardList.innerHTML = '<div class="lb-empty">Загрузка…</div>';
  leaderboardOverlay.classList.remove('hidden');
  try {
    const res = await fetch(API_URL + '/leaderboard');
    const data = await res.json();
    renderLeaderboard(data);
  } catch (e) {
    leaderboardList.innerHTML = '<div class="lb-empty">Не удалось загрузить рейтинг.<br>Попробуйте ещё раз через полминуты.</div>';
  }
}

function renderLeaderboard(entries) {
  if (!entries || entries.length === 0) {
    leaderboardList.innerHTML = '<div class="lb-empty">Пока никто не играл — будьте первым!</div>';
    return;
  }
  const medals = ['🥇', '🥈', '🥉'];
  leaderboardList.innerHTML = entries.map((e, i) => `
    <div class="lb-row">
      <span class="lb-rank">${medals[i] || (i + 1)}</span>
      <span class="lb-name">${escapeHtml(e.name)}</span>
      <span class="lb-score">${e.score}</span>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function update() {
  frame++;

  // physics
  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
    player.jumpsUsed = 0;
  }

  // spawn obstacles — интервал сокращается с ростом уровня, то есть коробки идут гуще
  spawnTimer++;
  if (spawnTimer >= nextSpawnIn) {
    spawnObstacle();
    spawnTimer = 0;
    const base = Math.max(30, 78 - level * 5);
    nextSpawnIn = base + Math.random() * 26;
  }

  // move obstacles + score
  for (const o of obstacles) {
    o.x -= speed;
    if (!o.passed && o.x + o.w < player.x) {
      o.passed = true;
      score++;
      scoreEl.textContent = score;

      const newLevel = 1 + Math.floor(score / POINTS_PER_LEVEL);
      if (newLevel > level) {
        level = newLevel;
        triggerLevelUp();
      }
    }
  }
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  // difficulty ramp — скорость растёт по уровням, не просто по очкам напрямую
  const speedLevel = Math.min(level, MAX_LEVEL_FOR_SPEED);
  speed = baseSpeed + (speedLevel - 1) * 0.85;

  if (levelToastTimer > 0) {
    levelToastTimer--;
    if (levelToastTimer === 0) levelToast.classList.remove('show');
  }

  if (checkCollision()) {
    endGame();
  }
}

function drawLogoWatermark() {
  if (!(logoImg.complete && logoImg.naturalWidth > 0)) return;
  const lw = 140;
  const lh = lw * (logoImg.naturalHeight / logoImg.naturalWidth);
  ctx.save();
  // subtle drop shadow keeps it legible against the sky without a solid backing
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;
  ctx.drawImage(logoImg, W - lw - 12, 12, lw, lh);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackgroundDetails();
  for (const o of obstacles) drawObstacle(o);
  drawPlayer();
  drawLogoWatermark();
}

function loop() {
  if (running) {
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

function startGame() {
  resetGame();
  running = true;
  overlay.classList.add('hidden');
}

startBtn.addEventListener('click', startGame);
secondaryBtn.addEventListener('click', openLeaderboard);
closeLeaderboardBtn.addEventListener('click', () => {
  leaderboardOverlay.classList.add('hidden');
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!running && !overlay.classList.contains('hidden')) startGame();
    else jump();
  }
});
canvas.addEventListener('pointerdown', () => {
  if (!running && !overlay.classList.contains('hidden')) return; // overlay button handles start
  jump();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
});
document.getElementById('wrap').addEventListener('pointerdown', (e) => {
  if (running) jump();
});

faceImg.onload = draw;
logoImg.onload = draw;
draw();
requestAnimationFrame(loop);
</script>
